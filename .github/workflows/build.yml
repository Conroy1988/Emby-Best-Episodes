name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/Emby.BestEpisodes.Tests/Emby.BestEpisodes.Tests.csproj

      - name: Test
        run: dotnet test tests/Emby.BestEpisodes.Tests/Emby.BestEpisodes.Tests.csproj --configuration Release --no-restore

      - name: Build plugin
        run: dotnet build src/Emby.BestEpisodes/Emby.BestEpisodes.csproj --configuration Release --no-restore

      - name: Stage DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item src/Emby.BestEpisodes/bin/Release/netstandard2.0/Emby.BestEpisodes.dll dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Emby.BestEpisodes-0.1.0
          path: dist/Emby.BestEpisodes.dll

      - name: Publish v0.1.0 prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v0.1.0 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.1.0 dist/Emby.BestEpisodes.dll --clobber
          }
          else {
            gh release create v0.1.0 dist/Emby.BestEpisodes.dll `
              --target "$env:GITHUB_SHA" `
              --title "Emby Best Episodes 0.1.0" `
              --notes "First Windows test build for Emby Server 4.9.5.0. Preconfigured for Ancient Aliens: Origins." `
              --prerelease
          }
